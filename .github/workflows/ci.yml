name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/server/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Verify demo package path
        run: |
          python -c "import lappa; assert lappa.__file__.endswith('src/lappa/__init__.py'), \
            f'Wrong path: {lappa.__file__}'; print('Demo package path OK')"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Demo
        run: lappa demo
