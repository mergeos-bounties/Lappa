<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lappa IDE</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:system-ui,sans-serif; background:#0b1220; color:#e2e8f0; }
    header { padding:1rem 1.25rem; border-bottom:1px solid #1e293b; display:flex; gap:1rem; align-items:center; }
    header h1 { margin:0; font-size:1.1rem; font-weight:600; }
    main { display:grid; grid-template-columns:220px 1fr 280px; min-height:calc(100vh - 52px); }
    aside, section, .panel { border-right:1px solid #1e293b; padding:1rem; }
    .panel { border-right:none; border-left:1px solid #1e293b; }
    .muted { color:#94a3b8; font-size:.9rem; }
    code { background:#111827; padding:.1rem .35rem; border-radius:4px; }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="app.title">Lappa IDE</h1>
    <span class="muted" data-i18n="app.subtitle">ROS2 package workspace shell</span>
  <span style="margin-left:auto; display:flex; gap:0.5rem; align-items:center;"><select id="locale-select" onchange="switchLocale(this.value)" style="background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:0.2rem 0.5rem; border-radius:4px; font-size:0.8rem;"><option value="en">EN</option><option value="vi">VI</option></select></span>
</header>
  <main>
    <aside>
      <strong data-i18n="nav.packages">Packages</strong>
      <p class="muted">Open a workspace via <code>lappa serve</code>.</p>
    </aside>
    <section>
      <strong data-i18n="nav.editor">Editor</strong>
      <p class="muted">Scaffold UI — connect to Lappa server API for file tree and build.</p>
    </section>
    <div class="panel">
      <strong>Sim / build</strong>
      <p class="muted">Native sim metrics and colcon status appear here.</p>
    </div>
  </main>

    <script>
      let currentLocale = 'en';
      let strings = {};

      async function loadStrings(locale) {
        try {
          const resp = await fetch('/api/i18n/strings?locale=' + locale);
          const data = await resp.json();
          strings = data.strings;
          applyStrings();
        } catch(e) { console.error('i18n load failed', e); }
      }

      function t(key, params) {
        let text = strings[key] || key;
        if (params) {
          for (const [k, v] of Object.entries(params)) {
            text = text.replace('{' + k + '}', v);
          }
        }
        return text;
      }

      function applyStrings() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (strings[key]) el.textContent = strings[key];
        });
        document.title = t('app.title');
      }

      function switchLocale(locale) {
        currentLocale = locale;
        localStorage.setItem('lappa_locale', locale);
        loadStrings(locale);
      }

      // Init
      const saved = localStorage.getItem('lappa_locale') || 'en';
      document.getElementById('locale-select').value = saved;
      loadStrings(saved);
    </script>
</body>
</html>
